{% extends "base.html" %}

{% block title %}Register API User - Flask REST API Provider{% endblock %}

{% block content %}
<div class="row justify-content-center pt-3">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="bg-success-subtle text-success p-3 rounded-circle d-inline-flex mb-3">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Create API Account</h3>
                    <p class="text-muted small">Register a new user in the Project 1 Provider database.</p>
                </div>

                <div id="registerAlert" class="alert d-none" role="alert"></div>

                <form id="providerRegisterForm" onsubmit="handleProviderRegister(event)">
                    <div class="mb-3">
                        <label for="regName" class="form-label small fw-semibold">Full Name</label>
                        <input type="text" class="form-control" id="regName" required placeholder="e.g. John Doe">
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label small fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="regEmail" required placeholder="name@example.com">
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label small fw-semibold">Password</label>
                        <input type="password" class="form-control" id="regPassword" minlength="6" required placeholder="Minimum 6 characters">
                    </div>
                    <button type="submit" id="regBtn" class="btn btn-success w-100 py-2 fw-semibold">
                        <i class="bi bi-person-check me-1"></i> Register Account
                    </button>
                </form>

                <div class="mt-4 pt-3 border-top text-center">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="{{ url_for('dashboard.login_page') }}" class="small fw-semibold text-decoration-none ms-1">Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
